name: SakuraFocus
options:
  bundleIdPrefix: top.jamesbar
targets:
  SakuraFocus:
    type: application
    platform: iOS
    sources:
      - path: SakuraFocus
        excludes:
          - Info.plist
      - path: AppResources/Web
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.jamesbar.sakurafocus
        INFOPLIST_FILE: SakuraFocus/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
